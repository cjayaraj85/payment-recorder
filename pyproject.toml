[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-recorder"
version = "0.1.0"
description = "Record payments in SQLite and generate receipts and reports."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Payment Recorder Maintainers" }
]
dependencies = []

[project.scripts]
payment-recorder = "payment_recorder.cli:main"
doc-agent = "doc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
